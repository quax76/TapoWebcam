services:
  tapo-webcam:
    build: .
    container_name: tapo-webcam
    restart: unless-stopped
    ports:
      - "8099:8099"
    environment:
      - TZ=Europe/Berlin
      - TAPO_PASSWORD=${TAPO_PASSWORD:-}   # from .env file (connection = "local" only)
      - SFTP_PASSWORD=${SFTP_PASSWORD:-}   # from .env file ([upload] with password only)
    volumes:
      - ./config.toml:/config/config.toml:ro
      - ./images:/data
